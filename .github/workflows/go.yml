# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go
permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches: [ "main" ]

jobs:

  ci:
    name: "Continuous Integration"
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:

    - name: "Install minimal dependencies for act micro image"
      if: env.ACT == 'true'
      run: |
        apt-get update && apt-get install -y --no-install-recommends \
          build-essential \
          ca-certificates

    - name: "Harden the runner (Audit all outbound calls)"
      if: env.ACT != 'true'
      uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
      with:
        egress-policy: block

    - name: "Checkout code"
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: "Set up Go"
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: go.mod

    - name: "Check format"
      run: make check-fmt

    - name: "Static Analysis"
      run: make vet

    - name: "Build"
      run: make build

    - name: "Test Coverage"
      run: make test-coverage
